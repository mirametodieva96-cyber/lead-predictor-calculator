<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Лява колона: Входни данни -->
        <aside class="sidebar">
            <div class="logo">📊 LeadPredictor - ERROR TEST</div>
            
            <div class="input-group">
                <label>Language</label>
                <select id="language">
                    <option value="en">🇺🇸 English</option>
                    <option value="bg">🇧🇬 Bulgarian</option>
                </select>
            </div>

            <div class="input-group">
                <label>Currency</label>
                <select id="currency">
                    <option value="usd">$ US Dollar</option>
                    <option value="bgn">лв. BGN</option>
                </select>
            </div>

            <div class="input-group">
                <label>Campaign Start</label>
                <input type="date" id="campaignStart" value="2026-05-08">
            </div>

            <div class="input-group">
                <label>Campaign End</label>
                <input type="date" id="campaignEnd" value="2026-11-04">
            </div>

            <div class="input-group">
                <label>Total Revenue</label>
                <input type="number" id="totalRevenue" value="10000">
            </div>

            <div class="input-group">
                <label>Avg. Order Value</label>
                <input type="number" id="avgOrderValue" value="1000">
            </div>
        </aside>

        <!-- Дясна част: Графика, Резултати и Слайдери -->
        <main class="main-content">
            <div class="top-layout">
                <!-- Място за бъдещата графика -->
                <div class="chart-container">
                    <p style="color: #6c7a9c; text-align: center; margin-top: 100px;">
                        [ Тук ще се визуализира хоризонталната графика ]
                    </p>
                </div>

                <!-- Картони с резултати (отдясно) -->
                <div class="results-container">
                    <div class="card">
                        <div class="card-header">📂 Prospects <span id="prospectPercent">100%</span></div>
                        <div class="card-value" id="resProspects">0</div>
                    </div>
                    <div class="card">
                        <div class="card-header">👤 Leads <span id="leadPercent">20%</span></div>
                        <div class="card-value" id="resLeads">0</div>
                    </div>
                    <div class="card">
                        <div class="card-header">🏆 Customers <span id="customerPercent">8%</span></div>
                        <div class="card-value" id="resCustomers">0</div>
                    </div>
                </div>
            </div>

            <!-- Долна част: Слайдери -->
            <footer class="sliders-container">
                <div class="slider-group">
                    <label>Lead Response Rate: <span id="leadRateVal">40.00%</span></label>
                    <input type="range" id="leadResponseRate" min="1" max="100" value="40" step="0.01">
                </div>
                <div class="slider-group">
                    <label>Prospect Response Rate: <span id="prospectRateVal">20.00%</span></label>
                    <input type="range" id="prospectResponseRate" min="1" max="100" value="20" step="0.01">
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
